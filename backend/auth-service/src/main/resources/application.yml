server:
  port: 8081

spring:
  application:
    name: auth-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/mbolo_auth
    redis:
      host: localhost
      port: 6379

jwt:
  secret: mbolo-super-secret-key-change-in-production-2025
  access-expiration: 900000      # 15 minutes
  refresh-expiration: 604800000  # 7 jours

bcrypt:
  strength: 12

management:
  endpoints:
    web:
      exposure:
        include: health,info
