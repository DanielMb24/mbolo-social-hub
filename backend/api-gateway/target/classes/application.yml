server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000,http://localhost:5173"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: http://user-service:8082
          predicates:
            - Path=/api/users/**
        - id: chat-service
          uri: http://chat-service:8083
          predicates:
            - Path=/api/chat/**,/ws-chat/**,/uploads/chat/**
        - id: post-service
          uri: http://post-service:8084
          predicates:
            - Path=/api/posts/**
        - id: video-service
          uri: http://video-service:8085
          predicates:
            - Path=/api/videos/**
        - id: moderation-service
          uri: http://moderation-service:8086
          predicates:
            - Path=/api/moderation/**

  data:
    redis:
      host: redis
      port: 6379

jwt:
  secret: mbolo-super-secret-key-change-in-production-2025

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
