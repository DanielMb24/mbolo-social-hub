server:
  port: 8083
spring:
  application:
    name: chat-service
  data:
    mongodb:
      uri: mongodb://localhost:27019/mbolo_chat
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
      file-size-threshold: 2KB
